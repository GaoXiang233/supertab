<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标签页已休眠 - SuperTab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .tab-info {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: left;
    }

    .tab-info-row {
      display: flex;
      margin-bottom: 12px;
    }

    .tab-info-row:last-child {
      margin-bottom: 0;
    }

    .tab-info-label {
      font-size: 12px;
      color: #999;
      width: 60px;
      flex-shrink: 0;
    }

    .tab-info-value {
      font-size: 14px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .favicon {
      width: 16px;
      height: 16px;
      vertical-align: middle;
      margin-right: 6px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .tips {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
    }

    .tips-title {
      font-weight: 500;
      margin-bottom: 8px;
      color: #666;
    }

    .tips-list {
      list-style: none;
      text-align: left;
    }

    .tips-list li {
      margin-bottom: 4px;
      padding-left: 16px;
      position: relative;
    }

    .tips-list li::before {
      content: '•';
      position: absolute;
      left: 4px;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">💤</div>
    <h1 class="title">此标签页已休眠</h1>
    <p class="subtitle">为了节省内存和提升浏览器性能，此标签页已被临时休眠。点击下方按钮可恢复。</p>

    <div class="tab-info" id="tabInfo">
      <div class="tab-info-row">
        <span class="tab-info-label">标题</span>
        <span class="tab-info-value" id="tabTitle">加载中...</span>
      </div>
      <div class="tab-info-row">
        <span class="tab-info-label">网址</span>
        <span class="tab-info-value" id="tabUrl">加载中...</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="restoreBtn">恢复标签页</button>
      <button class="btn btn-secondary" id="closeBtn">关闭</button>
    </div>

    <div class="tips">
      <div class="tips-title">💡 关于标签页休眠</div>
      <ul class="tips-list">
        <li>休眠的标签页不占用内存资源</li>
        <li>点击恢复按钮可立即重新加载页面</li>
        <li>可在设置中调整休眠阈值</li>
        <li>固定标签页不会被休眠</li>
      </ul>
    </div>
  </div>

  <script>
    (function() {
      function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      const tabUrl = getQueryParam('url');
      const tabTitle = getQueryParam('title');

      const tabTitleEl = document.getElementById('tabTitle');
      const tabUrlEl = document.getElementById('tabUrl');

      if (tabTitle) {
        tabTitleEl.textContent = decodeURIComponent(tabTitle);
        document.title = decodeURIComponent(tabTitle) + ' - 已休眠';
      } else {
        tabTitleEl.textContent = '未知标题';
      }

      if (tabUrl) {
        tabUrlEl.textContent = decodeURIComponent(tabUrl);
      } else {
        tabUrlEl.textContent = '未知网址';
      }

      const restoreBtn = document.getElementById('restoreBtn');
      restoreBtn.addEventListener('click', function() {
        if (tabUrl) {
          window.location.href = decodeURIComponent(tabUrl);
        } else {
          alert('无法恢复此标签页，请手动输入网址');
        }
      });

      const closeBtn = document.getElementById('closeBtn');
      closeBtn.addEventListener('click', function() {
        if (chrome && chrome.tabs && chrome.tabs.getCurrent) {
          chrome.tabs.getCurrent(function(tab) {
            if (tab) {
              chrome.tabs.remove(tab.id);
            } else {
              window.close();
            }
          });
        } else {
          window.close();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          restoreBtn.click();
        }
        if (e.key === 'Escape') {
          closeBtn.click();
        }
      });
    })();
  </script>
</body>
</html>
